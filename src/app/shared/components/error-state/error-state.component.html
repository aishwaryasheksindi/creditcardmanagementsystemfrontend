<div class="error-state-card d-flex flex-column align-items-center justify-content-center text-center p-5" role="alert">
  <div class="error-icon-wrapper d-flex align-items-center justify-content-center mb-3">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <h3 class="error-title mb-1">{{ title }}</h3>
  <p class="error-message text-secondary mb-4">{{ message }}</p>
  <button type="button" class="btn btn-outline" (click)="onRetry()">
    {{ retryLabel }}
  </button>
</div>
