<div class="spinner-container d-flex flex-column align-items-center justify-content-center p-3 gap-2" [ngClass]="'size-' + size" role="status" aria-live="polite">
  <div class="spinner-circle"></div>
  <span class="spinner-message text-secondary fw-medium" *ngIf="message">{{ message }}</span>
</div>
