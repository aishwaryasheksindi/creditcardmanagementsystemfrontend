<header class="page-header d-flex align-items-start justify-content-between flex-wrap gap-3 mb-4">
  <div class="page-header-info d-flex flex-column">
    <div class="page-title-row d-flex align-items-center flex-wrap gap-3">
      <h1 class="page-title m-0">{{ title }}</h1>
      <span *ngIf="badgeText" class="badge badge-primary">{{ badgeText }}</span>
    </div>
    <p *ngIf="subtitle" class="page-subtitle text-secondary m-0 mt-1">{{ subtitle }}</p>
  </div>
  <div class="page-header-actions d-flex align-items-center gap-2">
    <ng-content select="[header-actions]"></ng-content>
  </div>
</header>
