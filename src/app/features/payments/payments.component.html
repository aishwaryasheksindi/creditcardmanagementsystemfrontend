<div class="payments-feature">
  <app-page-header
    title="Payments & Settlements"
    subtitle="Card bill payments, reconciliation, and automated settlement cycles."

  <app-card-container [borderAccent]="true" title="Payments & Settlements Overview">
    <app-empty-state

  </app-card-container>
