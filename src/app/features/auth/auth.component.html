<div class="auth-page-container d-flex align-items-center justify-content-center min-vh-100 p-3 p-md-4">
  <div class="auth-card card-surface p-4 p-md-5 d-flex flex-column gap-4">
    <!-- Brand Header -->
    <div class="auth-brand d-flex flex-column align-items-center text-center">
      <div class="brand-badge mb-3 d-flex align-items-center justify-content-center">
        <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#5C2D56"/>
          <path d="M7 11C7 9.89543 7.89543 9 9 9H19C20.1046 9 21 9.89543 21 11V17C21 18.1046 20.1046 19 19 19H9C7.89543 19 7 18.1046 7 17V11Z" stroke="#FDF8F0" stroke-width="1.8"/>
          <line x1="7" y1="12.5" x2="21" y2="12.5" stroke="#FDF8F0" stroke-width="1.5"/>
          <circle cx="11" cy="16" r="1.2" fill="#FDF8F0"/>
        </svg>
      </div>
      <h1 class="brand-title fw-bold mb-1">CardNest</h1>
      <p class="brand-tagline text-secondary m-0">AI-Powered Credit Card Management &amp; Fraud Detection System</p>
    </div>

    <!-- Info / Session Alert -->
    <div *ngIf="infoMessage" class="alert alert-warning py-2 px-3 small d-flex align-items-center gap-2 mb-0" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ infoMessage }}</span>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-0" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Login Reactive Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="auth-form d-flex flex-column gap-3">
      <!-- Username Field -->
      <div class="form-group mb-0">
        <label class="form-label" for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="form-control"
          [class.is-invalid]="f['username'].touched && f['username'].invalid"
          placeholder="e.g. admin"
          autocomplete="username"
          [attr.disabled]="isLoading ? true : null" />
        <div *ngIf="f['username'].touched && f['username'].errors" class="form-error">
          <span *ngIf="f['username'].errors['required']">Username is required.</span>
          <span *ngIf="f['username'].errors['minlength']">Username must be at least 2 characters.</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group mb-0">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="f['password'].touched && f['password'].invalid"
          placeholder="Enter your password"
          autocomplete="current-password"
          [attr.disabled]="isLoading ? true : null" />
        <div *ngIf="f['password'].touched && f['password'].errors" class="form-error">
          <span *ngIf="f['password'].errors['required']">Password is required.</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary w-100 mt-2 d-flex align-items-center justify-content-center gap-2"
        [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Authenticating...' : 'Sign In to CardNest' }}</span>
      </button>
    </form>

    <!-- Footer Note -->
    <div class="auth-footer text-center pt-3 border-top">
      <span class="text-muted small">&copy; 2026 CardNest &bull; Enterprise Banking Security</span>
    </div>
  </div>
</div>
