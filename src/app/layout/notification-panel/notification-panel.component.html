<div class="notification-panel-overlay" *ngIf="isOpen" (click)="onClose()">
  <aside class="notification-panel" (click)="$event.stopPropagation()" role="dialog" aria-label="Notifications Panel">
    <div class="panel-header">
      <div class="panel-title-area">
        <h3>System Notifications</h3>
        <span class="badge badge-primary">{{ notifications.length }} New</span>
      </div>
      <button type="button" class="btn btn-icon" (click)="onClose()" aria-label="Close Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="panel-body">
      <div *ngFor="let item of notifications" class="notification-card">
        <div class="item-icon" [ngClass]="item.type">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="item-content">
          <span class="item-title">{{ item.title }}</span>
          <p class="item-message">{{ item.message }}</p>
          <span class="item-time">{{ item.time }}</span>
        </div>
      </div>
    </div>
  </aside>
</div>
