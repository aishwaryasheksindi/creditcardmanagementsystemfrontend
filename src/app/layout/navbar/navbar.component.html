<header class="app-navbar">
  <div class="navbar-left">
    <button
      type="button"
      class="nav-icon-btn hamburger-btn"
      (click)="onToggleSidebar()"
      aria-label="Toggle navigation menu"
      title="Toggle Sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="brand-container" routerLink="/app/dashboard">
      <div class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#5C2D56"/>
          <path d="M7 11C7 9.89543 7.89543 9 9 9H19C20.1046 9 21 9.89543 21 11V17C21 18.1046 20.1046 19 19 19H9C7.89543 19 7 18.1046 7 17V11Z" stroke="#FDF8F0" stroke-width="1.8"/>
          <line x1="7" y1="12.5" x2="21" y2="12.5" stroke="#FDF8F0" stroke-width="1.5"/>
          <circle cx="11" cy="16" r="1.2" fill="#FDF8F0"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">CardNest</span>
        <span class="brand-subtitle">AI-Powered Credit Card Management &amp; Fraud Detection</span>
      </div>
    </div>
  </div>

  <div class="navbar-right">
    <!-- Notification Bell -->
    <button
      type="button"
      class="nav-icon-btn notification-bell-btn"
      (click)="onToggleNotifications()"
      aria-label="Notifications"
      title="Open Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge" *ngIf="unreadNotificationCount > 0">{{ unreadNotificationCount }}</span>
    </button>

    <!-- User Profile Area Placeholder -->
    <div class="user-profile-widget" *ngIf="authService.currentUser$ | async as user">
      <div class="user-avatar" aria-hidden="true">
        <span>AM</span>
      </div>
      <div class="user-details">
        <span class="user-name">{{ user.fullName }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
    </div>
  </div>
</header>
