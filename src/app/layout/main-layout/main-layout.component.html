<div class="layout-container d-flex flex-column min-vh-100">
  <app-navbar
    [isSidebarOpen]="!isSidebarCollapsed"
    (toggleSidebar)="toggleSidebar()"
    (toggleNotifications)="toggleNotifications()">
  </app-navbar>

  <div class="layout-body d-flex flex-grow-1 position-relative">
    <!-- Desktop Sidebar -->
    <div class="sidebar-desktop">
      <app-sidebar [isCollapsed]="isSidebarCollapsed"></app-sidebar>
    </div>

    <!-- Mobile Drawer Sidebar with Backdrop -->
    <div class="sidebar-mobile-backdrop" *ngIf="isMobileSidebarOpen" (click)="closeMobileSidebar()">
      <div class="sidebar-mobile-drawer" (click)="$event.stopPropagation()">
        <app-sidebar [isCollapsed]="false" (navItemClicked)="closeMobileSidebar()"></app-sidebar>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="content-wrapper d-flex flex-column flex-grow-1">
      <main class="main-content flex-grow-1 container-xl py-4 px-3 px-md-4" role="main">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </div>
  </div>

  <app-notification-panel
    [isOpen]="isNotificationsOpen"
    (closePanel)="toggleNotifications()">
  </app-notification-panel>
</div>
